name: Publish Daily AI TIMES Edition

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and publish daily edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run publish:edition

      - name: Commit and push updated edition
        run: |
          git config user.name "The AI Columnist"
          git config user.email "editor@aitimes.live"
          git add data/editions.json
          git diff --staged --quiet || git commit -m "chore(edition): publish autonomous edition $(date -u +%Y-%m-%d)"
          git push
